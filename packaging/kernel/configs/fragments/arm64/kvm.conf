# arm64 KVM — lets this kernel act as a hypervisor for nested guests.
#
# True nested virtualization on arm64 requires the ARMv8.3 NV (Nested
# Virtualization) hardware extension, which most current arm64 CPUs lack.
# When the outer hypervisor exposes EL2 to this kernel, CONFIG_KVM enables
# the standard L1 hypervisor stack and KVM will run nested guests using
# whatever virtualization support the CPU exposes.

CONFIG_KVM=y
