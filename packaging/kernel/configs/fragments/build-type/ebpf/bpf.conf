# eBPF (extended Berkeley Packet Filter) — scoped to observability/tracing
# use cases (bcc, bpftrace, libbpf-based agents). Networking BPF (tc cls/act,
# XDP, sockmap, lwt) is intentionally left off to keep the kernel small.
#
# This is an opt-in build-type fragment: it is merged only when the kernel is
# built with `-b ebpf`. The default build omits it, producing a smaller kernel
# without the eBPF tracing stack or BTF.
#
# CONFIG_BPF_SYSCALL and CONFIG_CGROUP_BPF are already enabled in cgroup.conf.
# CONFIG_HAVE_EBPF_JIT is already enabled in network.conf.

CONFIG_BPF=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_JIT_DEFAULT_ON=y
CONFIG_BPF_EVENTS=y

# Default kernel.unprivileged_bpf_disabled=2 (require CAP_BPF for bpf()).
CONFIG_BPF_UNPRIV_DEFAULT_OFF=y

# Tracing primitives that BPF programs attach to.
CONFIG_KPROBES=y
CONFIG_UPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y
CONFIG_TRACING=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_DYNAMIC_FTRACE=y
CONFIG_FTRACE_SYSCALLS=y

# fprobe enables kprobe_multi (mass-attach kprobes) — big perf win for tools
# that hook many functions (bpftrace, retsnoop, etc.).
CONFIG_FPROBE=y

# bpf_override_return — lets BPF programs override return values of kprobed
# functions (fault injection, debugging). Pulls in FUNCTION_ERROR_INJECTION.
CONFIG_FUNCTION_ERROR_INJECTION=y
CONFIG_BPF_KPROBE_OVERRIDE=y

# BTF (BPF Type Format) — required for kfunc:/fentry/fexit probes, BTF-typed
# args, and CO-RE programs used by libbpf, bpftrace tools/*.bt, Tetragon, and
# most modern eBPF tooling. CO-RE agents read /sys/kernel/btf/vmlinux, which the
# kernel only exposes when CONFIG_DEBUG_INFO_BTF=y; without it Tetragon crashes
# at startup. Selects DEBUG_INFO via the DWARF toolchain default. Requires
# pahole (dwarves) at kernel build time.
#
# CONFIG_DEBUG_INFO_BTF_MODULES is intentionally omitted: CONFIG_MODULES=n
# (base.conf) makes this kernel monolithic, so there is no module BTF to emit.
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
CONFIG_DEBUG_INFO_BTF=y
