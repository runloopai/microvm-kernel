# !s390x

# Items to do with CPU frequency, power etc.

# CPU frequency scaling is meaningless in the guest — the host owns P-states —
# so the cpufreq core and its drivers (intel_pstate, acpi-cpufreq) only add
# boot-time driver probing. Disable the whole subsystem; keep CPU_IDLE.
CONFIG_CPU_FREQ=n
CONFIG_CPU_IDLE=y
CONFIG_CPU_IDLE_GOV_MENU=y
