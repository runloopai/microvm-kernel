# KVM (Kernel-based Virtual Machine) — lets this kernel act as a hypervisor
# for nested guests when running inside an outer VM that exposes virtualization
# extensions (Intel VMX / AMD SVM / ARMv8 EL2).
#
# Architecture-specific KVM modules live in the per-arch fragments.

CONFIG_VIRTUALIZATION=y

# vhost backends — accelerate virtio devices presented to nested guests.
CONFIG_VHOST=y
CONFIG_VHOST_NET=y
CONFIG_VHOST_VSOCK=y
CONFIG_VHOST_IOTLB=y
