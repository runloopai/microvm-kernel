# Virtio devices provide disks, networking, consoles and vsock.

# To get VIRTIO, we need a bus - ours of choice is PCI. We need to enable
# PCI support to get VIRTIO_PCI support
CONFIG_PCI=y
CONFIG_PCI_MSI=y
# To get to the VIRTIO_PCI, we need the VIRTIO_MENU enabled
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO_PCI=y
# Without this nested-VM Kata does not work (we have not worked out exactly why)
CONFIG_VIRTIO_PCI_LEGACY=y

# Disks are exposed as virtio-blk over PCI, without a SCSI layer.
CONFIG_SCSI=n
CONFIG_SCSI_LOWLEVEL=n
CONFIG_SCSI_VIRTIO=n
CONFIG_VIRTIO_BLK=y
CONFIG_TTY=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_VIRTIO_NET=y

CONFIG_VIRTIO_BALLOON=y
