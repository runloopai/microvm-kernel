# eBPF (extended Berkeley Packet Filter) — used by bcc/bpftrace, Cilium,
# libbpf-based observability agents, and tc/XDP-based networking.
#
# CONFIG_BPF_SYSCALL and CONFIG_CGROUP_BPF are already enabled in cgroup.conf.
# CONFIG_HAVE_EBPF_JIT is already enabled in network.conf.

CONFIG_BPF=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_JIT_DEFAULT_ON=y
CONFIG_BPF_EVENTS=y
CONFIG_BPF_STREAM_PARSER=y
CONFIG_BPF_LSM=y

# Tracing primitives that BPF programs attach to.
CONFIG_KPROBES=y
CONFIG_UPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y
CONFIG_TRACING=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_DYNAMIC_FTRACE=y
CONFIG_FTRACE_SYSCALLS=y

# Networking BPF: tc classifier/action and XDP.
CONFIG_NET_CLS_BPF=y
CONFIG_NET_ACT_BPF=y
CONFIG_NET_SCH_INGRESS=y
CONFIG_XDP_SOCKETS=y
CONFIG_XDP_SOCKETS_DIAG=y
CONFIG_LWTUNNEL_BPF=y
