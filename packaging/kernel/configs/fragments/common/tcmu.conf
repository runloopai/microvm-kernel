# LIO SCSI target subsystem and TCMU userspace backstore.
# Required for overlaybd-tcmu to run inside the cloud-hypervisor guest VM.
CONFIG_TARGET_CORE=y
# UIO (Userspace I/O) is a dependency of TCM_USER2; without it, make olddefconfig
# silently downgrades TCM_USER2 from =y to =n.
CONFIG_UIO=y
CONFIG_TCM_USER2=y
CONFIG_LOOPBACK_TARGET=y
