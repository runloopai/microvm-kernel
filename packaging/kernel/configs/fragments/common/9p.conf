# 9p is Kata's transport for mounting host directories into the workload.
# Runloop boots from a pmem init rootfs and serves the workload image over
# overlaybd (vhost-user), never 9p, so it is dead weight — disable it.
CONFIG_NET_9P=n
CONFIG_NET_9P_VIRTIO=n
CONFIG_9P_FS=n
CONFIG_NETWORK_FILESYSTEMS=n
