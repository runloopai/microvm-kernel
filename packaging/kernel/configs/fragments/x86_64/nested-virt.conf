# Nested virtualization support.
#
# Build KVM into the guest kernel so the microVM can itself act as an L1
# hypervisor and run L2 guests. Modules are disabled (CONFIG_MODULES=n in
# common/base.conf), so everything is built-in (=y).
#
# Both Intel (VMX) and AMD (SVM) backends are enabled so the same kernel image
# works on either host CPU. Whether L2 guests can actually run still depends on
# the host exposing nested virt (kvm_intel/kvm_amd nested=1) and the virtual CPU
# advertising VMX/SVM to the L1 guest.
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
CONFIG_KVM_INTEL=y
CONFIG_KVM_AMD=y
