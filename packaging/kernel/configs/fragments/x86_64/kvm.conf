# x86_64 KVM — Intel VMX and AMD SVM support for running nested guests.
#
# Nested virtualization (running L2 guests inside this L1 kernel) is enabled at
# runtime via the kvm_intel.nested=1 / kvm_amd.nested=1 module parameters,
# which default to 1 in modern kernels — no compile-time option is required.
# The outer hypervisor must expose VMX/SVM to this kernel (e.g. -cpu host on
# QEMU or vmx=on / svm=on on cloud-hypervisor) for KVM to load.
#
# CONFIG_KVM_GUEST is already enabled in base.conf.

CONFIG_KVM=y
CONFIG_KVM_INTEL=y
CONFIG_KVM_AMD=y
