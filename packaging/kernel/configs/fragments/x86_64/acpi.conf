# cpufreq is disabled in the guest (see common/cpu.conf), so its x86 driver
# and the ACPI P-state plumbing are unused.
CONFIG_X86_INTEL_PSTATE=n

# For old smp systems that do not have proper acpi support.
# Firecracker needs this to support `vcpu_count`
CONFIG_X86_MPPARSE=y

CONFIG_ACPI_CPU_FREQ_PSS=n
CONFIG_ACPI_HOTPLUG_IOAPIC=y
CONFIG_ACPI_LEGACY_TABLES_LOOKUP=y
CONFIG_ACPI_LPIT=y
CONFIG_ARCH_MIGHT_HAVE_ACPI_PDC=y
CONFIG_ACPI_PROCESSOR_CSTATE=y
CONFIG_ACPI_SYSTEM_POWER_STATES_SUPPORT=y
CONFIG_HAVE_ACPI_APEI_NMI=y
